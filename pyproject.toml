[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hh-ingest"
version = "0.1.0"
description = "Production-ready real estate data ingestion system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "HomeHistory Team" },
]
keywords = ["real-estate", "data-ingestion", "scraping", "attom", "zillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "httpx[http2]>=0.25.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.12.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
    "playwright>=1.37.0",
    "selectolax>=0.3.0",
    "user-agents>=2.2.0",
    "tqdm>=4.66.0",
    "psycopg2-binary>=2.9.0",
    "uvloop>=0.17.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "aiofiles>=23.2.0",
]

[project.scripts]
hh-ingest = "hh_ingest.cli:app"

[project.urls]
Homepage = "https://github.com/homehistory/hh-ingest"
Repository = "https://github.com/homehistory/hh-ingest"
Documentation = "https://github.com/homehistory/hh-ingest/blob/main/README.md"
Issues = "https://github.com/homehistory/hh-ingest/issues"

[tool.hatch.version]
path = "hh_ingest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hh_ingest"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["hh_ingest"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "selectolax.*",
    "user_agents.*",
    "playwright.*",
    "orjson.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hh_ingest",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "scraper: marks tests that require network access",
]

[tool.coverage.run]
source = ["hh_ingest"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
